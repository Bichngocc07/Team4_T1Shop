
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - TShop</title>
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <main class="auth-container">
        <section class="auth-card">
            <a href="login.html" class="back-link">← Quay lại đăng nhập</a>

            <div class="auth-header">
                <h1>Quên mật khẩu?</h1>
                <p>
                    Nhập email hoặc số điện thoại đã đăng ký.
                    Chúng tôi sẽ hỗ trợ bạn khôi phục mật khẩu.
                </p>
            </div>

            <form class="auth-form">
                <label for="contact">Email hoặc số điện thoại</label>
                <input
                    type="text"
                    id="contact"
                    name="contact"
                    placeholder="Nhập email hoặc số điện thoại"
                    required
                    pattern="([A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,})|((\+?84|0)(3|5|7|8|9)[0-9]{8})"
                    title="Vui lòng nhập email hoặc số điện thoại Việt Nam hợp lệ"
                >

                <button type="button" disabled>
                    Gửi yêu cầu
                </button>

                <p class="form-note">
                    Chức năng gửi yêu cầu sẽ được kích hoạt khi Backend hỗ trợ.
                </p>
            </form>
        </section>
    </main>
</body>
</html>
